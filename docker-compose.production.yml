services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.production

    image: graduation-project-app:production

    container_name: graduation-app

    restart: unless-stopped

    env_file:
      - .env.production

    networks:
      - production

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

    volumes:
      - storage:/var/www/html/storage/app/public


  nginx:
    image: nginx:1.27-alpine

    container_name: graduation-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./docker/production/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage/app/public:ro

    networks:
      - production

    depends_on:
      - app


  horizon:
    image: graduation-project-app:production

    container_name: graduation-horizon

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan horizon

    networks:
      - production

    depends_on:
      - redis
      - mysql


  scheduler:
    image: graduation-project-app:production

    container_name: graduation-scheduler

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan schedule:work

    networks:
      - production

    depends_on:
      - mysql


  reverb:
    image: graduation-project-app:production

    container_name: graduation-reverb

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan reverb:start --host=0.0.0.0 --port=8080

    ports:
      - "8080:8080"

    networks:
      - production

    depends_on:
      - redis


  mysql:

    image: mysql:8.0

    container_name: graduation-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql:/var/lib/mysql

    networks:
      - production

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



  redis:

    image: redis:alpine

    container_name: graduation-redis

    restart: unless-stopped

    volumes:
      - redis:/data

    networks:
      - production

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



  meilisearch:

    image: getmeili/meilisearch:v1.16

    container_name: graduation-meilisearch

    restart: unless-stopped

    environment:

      MEILI_ENV: production

      MEILI_NO_ANALYTICS: "true"

      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

    volumes:

      - meilisearch:/meili_data


    networks:
      - production


    healthcheck:

      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:7700/health"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



  ollama:

    image: ollama/ollama:latest

    container_name: graduation-ollama

    restart: unless-stopped


    volumes:

      - ollama:/root/.ollama


    networks:

      - production



networks:

  production:

    driver: bridge



volumes:

  mysql:

  redis:

  meilisearch:

  ollama:

  storage:
