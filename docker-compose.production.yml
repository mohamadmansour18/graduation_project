x-app-storage-volumes: &app-storage-volumes
  - type: volume
    source: storage
    target: /var/www/html/storage/app

  - type: bind
    source: ./storage/app/firebase
    target: /var/www/html/storage/app/firebase
    read_only: true
    bind:
      create_host_path: false


services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.production

    image: graduation-project-app:production

    container_name: graduation-app

    restart: unless-stopped

    env_file:
      - .env.production

    networks:
      - production

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

    volumes: *app-storage-volumes


  nginx:
    image: nginx:1.27-alpine

    container_name: graduation-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/production/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/production/certbot/www:/var/www/certbot:ro
      - ./docker/production/certbot/conf:/etc/letsencrypt:ro
      - type: volume
        source: storage
        target: /var/www/html/storage/app
        read_only: true
        volume:
          nocopy: true

    networks:
      - production

    depends_on:
      - app


  horizon:
    image: graduation-project-app:production

    container_name: graduation-horizon

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan horizon

    networks:
      - production

    volumes: *app-storage-volumes

    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy


  scheduler:
    image: graduation-project-app:production

    container_name: graduation-scheduler

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan schedule:work

    networks:
      - production

    volumes: *app-storage-volumes

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy


  reverb:
    image: graduation-project-app:production

    container_name: graduation-reverb

    restart: unless-stopped

    env_file:
      - .env.production

    command:
      php artisan reverb:start --host=0.0.0.0 --port=8080

    networks:
      - production

    depends_on:
      redis:
        condition: service_healthy


  mysql:

    image: mysql:8.0

    container_name: graduation-mysql

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}

    volumes:
      - mysql:/var/lib/mysql

    networks:
      - production

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



  redis:

    image: redis:alpine

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]

    container_name: graduation-redis

    restart: unless-stopped

    volumes:
      - redis:/data

    networks:
      - production

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  meilisearch:

    image: getmeili/meilisearch:v1.16

    container_name: graduation-meilisearch

    restart: unless-stopped

    environment:

      MEILI_ENV: production

      MEILI_NO_ANALYTICS: "true"

      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set}

    volumes:

      - meilisearch:/meili_data


    networks:
      - production


    healthcheck:

      test:
        [  "CMD", "wget", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5



  ollama:

    image: ollama/ollama:latest

    container_name: graduation-ollama

    restart: unless-stopped


    volumes:

      - ollama:/root/.ollama


    networks:

      - production



networks:

  production:

    driver: bridge



volumes:

  mysql:

  redis:

  meilisearch:

  ollama:

  storage:
