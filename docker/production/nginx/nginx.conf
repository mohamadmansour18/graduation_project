# =========================================================
# HTTP server
# =========================================================
server {
    listen 80;

    server_name nerdsoftwares.tech www.nerdsoftwares.tech;

    # Let's Encrypt HTTP-01 verification files
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect every other HTTP request to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================================================
# HTTPS server
# =========================================================
server {
    listen 443 ssl;

    http2 on;

    server_name nerdsoftwares.tech www.nerdsoftwares.tech;

    client_max_body_size 50M;


    # -----------------------------------------------------
    # TLS certificate
    # -----------------------------------------------------
    ssl_certificate
        /etc/letsencrypt/live/nerdsoftwares.tech/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/nerdsoftwares.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;


    # -----------------------------------------------------
    # Reverb WebSocket
    # -----------------------------------------------------
    location /app/ {
        proxy_pass http://reverb:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }


    # -----------------------------------------------------
    # Public storage
    # -----------------------------------------------------
    location /storage/ {
        alias /var/www/html/storage/app/public/;

        access_log off;
        expires 30d;
    }


    # -----------------------------------------------------
    # Laravel Octane
    # -----------------------------------------------------
    location / {
        proxy_pass http://app:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Connection "";

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
